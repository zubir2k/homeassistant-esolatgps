rules:
  # Bronze
  action-setup:
    status: exempt
    comment: The integration registers no actions.
  appropriate-polling:
    status: done
    comment: User-set interval, 5 to 60 minutes (default 15), because people move around during the day.
  brands: done
  common-modules: done
  config-flow: done
  config-flow-test-coverage: done
  dependency-transparency:
    status: done
    comment: No third-party requirements.
  docs-actions:
    status: exempt
    comment: The integration registers no actions.
  docs-conditions:
    status: exempt
    comment: The integration provides no conditions.
  docs-high-level-description: done
  docs-installation-instructions: done
  docs-removal-instructions: done
  docs-triggers:
    status: exempt
    comment: The integration provides no triggers.
  entity-event-setup: done
  entity-unique-id: done
  has-entity-name: done
  runtime-data: done
  test-before-configure: done
  test-before-setup: done
  unique-config-entry: done

  # Silver
  action-exceptions:
    status: exempt
    comment: The integration registers no actions.
  config-entry-unloading: done
  docs-configuration-parameters: done
  docs-installation-parameters: done
  entity-unavailable: done
  integration-owner: done
  log-when-unavailable: done
  parallel-updates: done
  reauthentication-flow:
    status: exempt
    comment: Public APIs, no credentials.
  test-coverage: done

  # Gold
  devices: done
  diagnostics: done
  discovery:
    status: exempt
    comment: Cloud service, nothing to discover.
  discovery-update-info:
    status: exempt
    comment: Cloud service, nothing to discover.
  docs-data-update: done
  docs-examples: done
  docs-known-limitations: done
  docs-supported-devices:
    status: exempt
    comment: Service integration, no devices.
  docs-supported-functions: done
  docs-troubleshooting: done
  docs-use-cases: done
  dynamic-devices:
    status: exempt
    comment: One service device per entry.
  entity-category:
    status: exempt
    comment: All entities are primary.
  entity-device-class:
    status: exempt
    comment: The state is a place name; no sensor device class fits.
  entity-disabled-by-default:
    status: exempt
    comment: Every entity is a core part of the integration.
  entity-translations: done
  exception-translations: todo
  icon-translations: done
  reconfiguration-flow:
    status: exempt
    comment: Nothing to reconfigure; all settings are in the options flow.
  repair-issues:
    status: exempt
    comment: No user-fixable problems to raise.
  stale-devices:
    status: exempt
    comment: One service device per entry, removed with the entry.

  # Platinum
  async-dependency:
    status: exempt
    comment: No dependency library; uses aiohttp directly.
  inject-websession: done
  strict-typing: todo
